# Example Clusters Configuration
# This file demonstrates various cluster configurations for different cloud providers
# and on-premises deployments.
#
# Copy this file to your config/environments/ directory and modify as needed.

[settings]
type = "data"

# =============================================================================
# AZURE CLUSTERS - Cloud Volumes ONTAP in Azure
# =============================================================================

[clusters.AZURE-PROD-01]
# Azure CVO with full cloud metadata (populated from cache after discovery)
name = "AZURE-PROD-01"
ip = "10.0.1.100"
div = "Engineering"
bu = "Platform"
app = "DataServices"
env = "Prod"
subapp = ""
cloud = "azure"
region = "eastus"
tags = ["active", "cvo", "ha"]

[clusters.AZURE-PROD-02]
# Azure CVO single-node
name = "AZURE-PROD-02"
ip = "10.0.1.101"
div = "Engineering"
bu = "Platform"
app = "DataServices"
env = "Prod"
subapp = "Analytics"
cloud = "azure"
region = "eastus2"
tags = ["active", "cvo", "single-node"]

[clusters.AZURE-DEV-01]
# Azure development cluster
name = "AZURE-DEV-01"
ip = "10.0.2.100"
div = "Engineering"
bu = "Platform"
app = "DataServices"
env = "Dev"
subapp = ""
cloud = "azure"
region = "westus"
tags = ["active", "cvo"]

# =============================================================================
# AWS CLUSTERS - Cloud Volumes ONTAP in AWS
# =============================================================================

[clusters.AWS-PROD-01]
# AWS CVO HA pair in us-east-1
name = "AWS-PROD-01"
ip = "10.1.1.100"
div = "Finance"
bu = "Treasury"
app = "FinanceData"
env = "Prod"
subapp = ""
cloud = "aws"
region = "us-east-1"
tags = ["active", "cvo", "ha"]

[clusters.AWS-PROD-02]
# AWS CVO in us-west-2
name = "AWS-PROD-02"
ip = "10.1.2.100"
div = "Finance"
bu = "Accounting"
app = "Reports"
env = "Prod"
subapp = ""
cloud = "aws"
region = "us-west-2"
tags = ["active", "cvo", "single-node"]

[clusters.AWS-DR-01]
# AWS DR cluster
name = "AWS-DR-01"
ip = "10.1.3.100"
div = "Finance"
bu = "Treasury"
app = "FinanceData"
env = "DR"
subapp = ""
cloud = "aws"
region = "us-east-2"
tags = ["standby", "cvo", "dr"]

