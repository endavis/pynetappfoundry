[general]
# Console SaaS (BlueXP) API settings.
#
# Two auth modes: static tokens (user_token / service_token), or OAuth client
# credentials (client_id / client_secret) for a Console service account.
# At least one source is required. See notes.txt for how to obtain them.

user_token = 'paste-user-jwt-here'
# user_token = 'SOPS[...]'  # encrypted value, produced by: nf config encrypt-value

# Refresh-token mode (alternative to user_token; setting both is an error).
# The refresh token does NOT go in this file: put it in users.toml under
# [console] (nf config set-credential --type console). The client then renews
# the 24h user access token itself. See notes.txt.
# user_client_id has a default (NetApp's public client id); override it only
# together with a refresh token.
# user_client_id = 'Mu0V1ywgYteI6w1MbD15fKfVIUrNXGWC'

# Client-credentials mode (alternative to service_token; setting both is an
# error). The client fetches and renews the service token itself.
# client_id = 'your-service-account-client-id'
# client_secret = 'your-service-account-client-secret'
# client_secret = 'SOPS[...]'  # encrypted value, produced by: nf config encrypt-value
# token_endpoint and audience have defaults; set them only with the two above.
# token_endpoint = 'https://netapp-cloud-account.auth0.com/oauth/token'
# audience = 'https://api.cloud.netapp.com'

# Optional. Lazy-validated: ConsoleAPIClient only constructs the service-token
# APIWrapper when this is present. Calling a service-typed endpoint without
# a service_token raises ConsoleServiceTokenMissingError.
# service_token = 'paste-service-account-jwt-here'
# service_token = 'SOPS[...]'  # encrypted value, produced by: nf config encrypt-value

# The host comes from base_url. The bundled Console spec keys each operation by
# its full path (for example /v1/management/organizations), so base_api_path has
# no effect with it. It is only a fallback for operations that declare no `servers`.
base_url = 'https://api.bluexp.netapp.com'
base_api_path = '/'

# Default organization id. Can be overridden per Console(...) instance.
org_id = 'your-org-id'

# Optional. Console agent ids that Console.find_connector(cluster_uuid) searches
# when it is called without an agent_ids argument. Agent ids end in `clients`.
# The tenancy API lists none for a service token, so they are configured here.
# agent_ids = ['your-agent-idclients', 'your-other-agent-idclients']

timeout = 30.0
