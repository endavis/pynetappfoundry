[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "pynetappfoundry"
description = "ONTAP administration library and CLI tools"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
dynamic = ["version"]
authors = [
    { name = "Eric Davis", email = "endavis@gmail.com" },
]
license = { file = "LICENSE" }
keywords = ["netapp", "ontap", "storage", "cli", "administration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "click>=8.1",
    "doit>=0.36.0",
    "rich>=13.0",
    "jsonschema>=4.25.1",
    "netapp-ontap>=9.17.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "cryptography>=46.0.6",
    "paramiko>=4.0.0",
    "psutil>=7.1.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "tomli_w>=1.0",
    "xlsxwriter>=3.2.9",
    "requests>=2.31",
    "yattag>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "pre-commit>=3.7.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "codespell>=2.2",
    "pyproject-fmt>=2.0",
    "commitizen>=3.0",
    "pyright>=1.1.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
    "types-paramiko>=3.0",
    "vulture>=2.11",
    "radon>=6.0",
    "mutmut>=3.0",
    "hypothesis>=6.0",
]
security = [
    "pip-audit>=2.6",
    "bandit>=1.7",
    "pip>=26.0",
    "pip-licenses>=4.0",
    "cyclonedx-bom>=4.0",
]

[project.urls]
Homepage = "https://github.com/endavis/pynetappfoundry"
Repository = "https://github.com/endavis/pynetappfoundry"
Documentation = "https://github.com/endavis/pynetappfoundry/tree/main/docs"
Issues = "https://github.com/endavis/pynetappfoundry/issues"

[project.scripts]
nf = "pynetappfoundry.cli:nf"

[tool.hatch.build.targets.wheel]
packages = ["src/pynetappfoundry"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?:v|d)(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/pynetappfoundry/_version.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (type hints)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
]
ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (Any) - needed for JSON handling
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# SIM117: yattag uses nested with statements for HTML structure, not fixable
"src/pynetappfoundry/cli/commands/reports/html.py" = ["SIM117"]
"tools/pyproject_template/*.py" = [
    "ANN401",  # Any return type for dynamic GitHub API responses
    "RUF022",  # __all__ intentionally grouped by category, not sorted
]
"tests/benchmarks/*.py" = [
    "ANN401",  # benchmark fixture has no py.typed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
# tools/pyproject_template/ uses sys.path manipulation for standalone execution
exclude = ["tools/pyproject_template/", ".claude/", ".gemini/", ".codex/"]

[[tool.mypy.overrides]]
# netapp-ontap 9.18.1+ uses apipkg lazy loading; mypy cannot resolve dynamic attributes
module = "netapp_ontap.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["paramiko.*", "yattag.*", "doit.*", "openpyxl.*", "jsonschema.*", "xlsxwriter.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Standalone scripts using sys.path manipulation; excluded from discovery
# but still followed via imports from bootstrap.py
module = "tools.pyproject_template.*"
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-config --strict-markers --benchmark-disable"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "benchmark: marks tests as performance benchmarks (deselect with '--benchmark-disable')",
    "property: marks tests as property-based tests (run with Hypothesis)",
]

[tool.pytest-benchmark]
disable_gc = true
min_rounds = 5
warmup = true

[tool.coverage.run]
branch = true
source = ["pynetappfoundry"]

[tool.coverage.report]
skip_covered = false
show_missing = true
precision = 2
fail_under = 10  # TODO: Increase as test coverage improves
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "tmp/htmlcov"

[tool.coverage.xml]
output = "tmp/coverage.xml"

[tool.bandit]
exclude_dirs = [
    "tests",
    "tmp",
    ".venv",
    "docs",
    "examples",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "site",
    ".claude",
    ".gemini",
    ".codex",
    ".devcontainer",
    ".vscode",
]
skips = [
    "B101",  # assert used
    "B507",  # SSH host key verification - intentional for ONTAP management
    "B601",  # paramiko calls - commands are internal, not user input
    "B603",  # subprocess without shell
    "B607",  # partial path
    "B608",  # SQL f-strings - table/column names are code-controlled, not user input
]

[tool.codespell]
skip = "tmp,.venv,.git,*.lock,*.pyc,__pycache__,docs/example-config/apis"
ignore-words-list = "crate,bu,medias,notin"

[tool.pyright]
# LSP support for Claude Code - provides fast code navigation and type checking
include = [
    "src",
    "tests",
    "*.py",           # Root level Python files (dodo.py, setup-repo.py, configure.py)
    "tools",          # Tools directory (migrate_existing_project.py)
    ".github",        # Any Python in GitHub workflows/scripts
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/tmp",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/site",        # mkdocs build output
    "**/.git",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false

[tool.vulture]
min_confidence = 80
paths = ["src", "tests"]
exclude = [
    "*/tests/*",      # Test fixtures often appear unused
    "*/__pycache__/*",
]
# Common false positives in Python projects
ignore_names = [
    "test_*",         # Pytest test functions
    "fixture_*",      # Pytest fixtures
    "*_fixture",      # Pytest fixtures
    "setUp",          # unittest methods
    "tearDown",       # unittest methods
    "setUpClass",     # unittest methods
    "tearDownClass",  # unittest methods
]
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.mark.*",
    "@click.command",
    "@click.option",
    "@click.group",
    "@click.argument",
    "@click.pass_context",
    "@click.version_option",
    "@abstractmethod",
    "@field_validator",
    "@model_validator",
    "@cached_property",
]

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "uv run python -m pytest -x --assert=plain"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
merge_prerelease = true
bump_pattern = "^(feat|fix|refactor|perf)"
bump_map = { "feat" = "MINOR", "fix" = "PATCH", "refactor" = "PATCH", "perf" = "PATCH" }
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.54.0",
]
