[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "pynetappfoundry"
description = "ONTAP administration library and CLI tools"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
dynamic = ["version"]
authors = [
    { name = "Eric Davis", email = "endavis@gmail.com" },
]
license = { file = "LICENSE" }
keywords = ["netapp", "ontap", "storage", "cli", "administration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "click>=8.1",
    "doit>=0.36.0",
    "rich>=15.0.0",
    "jsonschema>=4.25.1",
    "netapp-ontap>=9.17.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "cryptography>=50.0.0",
    "paramiko>=5.1.0",
    "psutil>=7.1.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "tomli_w>=1.0",
    "xlsxwriter>=3.2.9",
    "requests>=2.31",
    "yattag>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "pre-commit>=3.7.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=1.0.4",
    "codespell>=2.2",
    "pyproject-fmt>=2.0",
    "commitizen>=4.13.10",
    "pyright>=1.1.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
    "types-paramiko>=4.0.0.20260408",
    "vulture>=2.11",
    "radon>=6.0",
    "mutmut>=3.0",
    "hypothesis>=6.151.14",
    "openapi-spec-validator>=0.7",
]
security = [
    "pip-audit>=2.6",
    "bandit>=1.7",
    "pip>=26.0",
    "pip-licenses>=4.0",
    "cyclonedx-bom>=4.0",
]

[project.urls]
Homepage = "https://github.com/endavis/pynetappfoundry"
Repository = "https://github.com/endavis/pynetappfoundry"
Documentation = "https://github.com/endavis/pynetappfoundry/tree/main/docs"
Issues = "https://github.com/endavis/pynetappfoundry/issues"

[project.scripts]
nf = "pynetappfoundry.cli:nf"

[tool.hatch.build.targets.wheel]
packages = ["src/pynetappfoundry"]

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?:v|d)(?P<version>.+)$"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/pynetappfoundry/_version.py"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/_version.py", "examples"]
force-exclude = true

[tool.ruff.lint]
# Enable preview mode but require rules to be listed by exact code so we
# opt into PLW1514 without pulling in every other unstable preview rule.
preview = true
explicit-preview-rules = true
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (type hints)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "PLW1514",  # require explicit encoding on text-mode file I/O (preview rule)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Project divergence: the template enforces ANN401 everywhere. These paths still
# use Any for dynamically typed JSON handling; template-owned code (tools/doit/)
# is checked as upstream, so its `# noqa: ANN401` comments stay in use (#826).
"src/**" = ["ANN401"]
"tools/scripts/swagger12_to_20.py" = ["ANN401"]
"tools/console_openapi/openapi/builder.py" = ["ANN401"]
"tests/*" = ["ANN"]
# SIM117: yattag uses nested with statements for HTML structure, not fixable
"src/pynetappfoundry/cli/commands/reports/html.py" = ["SIM117"]
"tools/pyproject_template/*.py" = [
    "ANN401",  # Any return type for dynamic GitHub API responses
    "RUF022",  # __all__ intentionally grouped by category, not sorted
]
"tests/benchmarks/*.py" = [
    "ANN401",  # benchmark fixture has no py.typed
]
# Generated by ``doit console_models`` from the Console OpenAPI spec.
# The upstream API uses camelCase field names (N815) and ships verbose
# field descriptions that overflow line length (E501); both are inherent
# to the source spec, not stylistic choices we control.
"src/pynetappfoundry/models/console/*" = [
    "E501",    # Long lines from upstream field descriptions
    "N815",    # mixedCase field names from the upstream JSON API
    "RUF012",  # Mutable class attributes — generated, not hand-edited
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unreachable = true
# tests/ is a package (tests/__init__.py), but pytest's pythonpath = [".", "tests"]
# (pyproject.toml, #827) lets test files do a bare `from agent_roster import ...`.
# mypy_path makes that import resolvable too. tests/agent_roster.py itself is
# excluded from the tests/ walk below so mypy only ever sees it under the one
# module name resolved via mypy_path, not also as tests.agent_roster — both at
# once raises "Source file found twice under different module names" (#829).
mypy_path = "tests"
exclude = [".claude/", ".codex/", "^tests/agent_roster\\.py$"]

[[tool.mypy.overrides]]
# netapp-ontap 9.18.1+ uses apipkg lazy loading; mypy cannot resolve dynamic attributes
module = "netapp_ontap.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["paramiko.*", "yattag.*", "doit.*", "openpyxl.*", "jsonschema.*", "xlsxwriter.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# tools/pyproject_template/ scripts run standalone and do `sys.path.insert`
# before importing their siblings by bare name (`from utils import ...`).
# mypy cannot resolve those, so suppress the import errors by naming the
# sibling modules. Suppressing only the imports — rather than excluding the
# directory, as this config previously did — keeps the other ~5,300 lines
# type-checked. See issue #700.
module = [
    "check_template_updates",
    "cleanup",
    "configure",
    "repo_settings",
    "settings",
    "setup_repo",
    "utils",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# pytest-benchmark reads its settings only from these flags, never from a pyproject table (#879).
# Disabled runs ignore them, so they apply only when a benchmark run adds --benchmark-enable.
addopts = "--strict-config --strict-markers --benchmark-disable --benchmark-disable-gc --benchmark-warmup=on"
testpaths = ["tests"]
# Project divergence: upstream has no tests/__init__.py, so pytest puts tests/ on
# sys.path and template tests import tests/agent_roster.py as a top-level module.
# Here tests/ is a package, so it is listed explicitly (#827).
pythonpath = [".", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "benchmark: marks tests as performance benchmarks (deselect with '--benchmark-disable')",
    "property: marks tests as property-based tests (run with Hypothesis)",
]

[tool.coverage.run]
branch = true
# `tools/` is the code that runs releases, creates PRs and blocks dangerous
# commands, so it is measured alongside the package. See
# docs/development/ci-cd-testing.md for the downstream/template split.
source = ["pynetappfoundry", "tools"]
# tools/pyproject_template/ is the template's own management suite. ADR-9017
# makes its tests template-owned, so it is never tested here; left in scope it
# would be measured but not exercised (#731 upstream).
omit = ["tools/pyproject_template/*"]

[tool.coverage.report]
skip_covered = false
show_missing = true
precision = 2
# Measured 77.75% for pynetappfoundry + tools/ on 2026-10-25 (#826). The ~3pp
# margin is deliberate, as in the template: a threshold set exactly at the
# measured value fails on trivial variation. Raise it as coverage improves, and
# treat lowering it as a change that needs justification.
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "tmp/htmlcov"

[tool.coverage.xml]
output = "tmp/coverage.xml"

[tool.bandit]
exclude_dirs = [
    "tests",
    "tmp",
    ".venv",
    "docs",
    "examples",
    ".git",
    ".github",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "site",
    ".claude",
    ".codex",
    ".devcontainer",
    ".vscode",
]
skips = [
    "B101",  # assert used
    "B507",  # SSH host key verification - intentional for ONTAP management
    "B601",  # paramiko calls - commands are internal, not user input
    "B603",  # subprocess without shell
    "B607",  # partial path
    "B608",  # SQL f-strings - table/column names are code-controlled, not user input
]

[tool.codespell]
skip = "tmp,.venv,.git,*.lock,*.pyc,__pycache__,docs/example-config/apis"
ignore-words-list = "crate,bu,medias,notin"

[tool.pyright]
# LSP support for Claude Code - provides fast code navigation and type checking
include = [
    "src",
    "tests",
    "*.py",           # Root level Python files (dodo.py, setup-repo.py, configure.py)
    "tools",          # Tools directory
    ".github",        # Any Python in GitHub workflows/scripts
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/tmp",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/site",        # mkdocs build output
    "**/.git",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false

[tool.vulture]
min_confidence = 80
paths = ["src", "tests", "tools"]
exclude = [
    "*/tests/*",      # Test fixtures often appear unused
    "*/__pycache__/*",
]
# Common false positives in Python projects
ignore_names = [
    # Imported under `if TYPE_CHECKING:` and referenced only from string
    # annotations (e.g. `console: "ConsoleType"`), which vulture does not
    # parse. Deleting these imports would break type checking.
    "ConsoleType",
    # Required by the descriptor protocol (`__get__(self, obj, objtype=None)`)
    # in data/filters.py and models/_base.py, even when unused.
    "objtype",
    # Unused optional parameter of the one-off migration script
    # tools/codegen/migrate_submodel_fields.py.
    "api_paths_hint",
    "test_*",         # Pytest test functions
    "fixture_*",      # Pytest fixtures
    "*_fixture",      # Pytest fixtures
    "setUp",          # unittest methods
    "tearDown",       # unittest methods
    "setUpClass",     # unittest methods
    "tearDownClass",  # unittest methods
]
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.mark.*",
    "@click.command",
    "@click.option",
    "@click.group",
    "@click.argument",
    "@click.pass_context",
    "@click.version_option",
    "@abstractmethod",
    "@field_validator",
    "@model_validator",
    "@cached_property",
]

[tool.mutmut]
source_paths = ["src/"]
# The tests that exercise src/, not all of tests/. mutmut runs them inside
# mutants/, a copy holding src/, tests/ and the project files but not tools/ or
# the rest of the repository. One test there that imports tools or reads a repo
# file stops the stats run, and no mutant gets checked (#873).
# tests/test_mutmut_config.py fails when a test that imports the package is
# missing from this list. tests/unit/codegen/ and tests/unit/console_openapi/
# test tools/, so they are left out.
pytest_add_cli_args_test_selection = [
    "tests/integration",
    "tests/unit/cache",
    "tests/unit/cli",
    "tests/unit/clients",
    "tests/unit/compliance",
    "tests/unit/console",
    "tests/unit/core",
    "tests/unit/data",
    "tests/unit/db",
    "tests/unit/models",
    "tests/unit/query",
    "tests/unit/units",
    "tests/unit/utils",
    "tests/unit/test_config.py",
    "tests/unit/test_config_commands.py",
    "tests/unit/test_db.py",
    "tests/unit/test_models.py",
    "tests/unit/test_openapi.py",
    "tests/unit/test_perf_patches.py",
    "tests/unit/test_size_utils.py",
]
# mutmut passes -x to pytest itself. --assert=plain skips assertion rewriting,
# which mutmut has no use for: it reads only whether the tests pass (#839).
pytest_add_cli_args = ["--assert=plain"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
merge_prerelease = true
bump_pattern = "^(feat|fix|refactor|perf)"
bump_map = { "feat" = "MINOR", "fix" = "PATCH", "refactor" = "PATCH", "perf" = "PATCH" }
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.54.0",
]
