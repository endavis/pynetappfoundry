# pyproject-template sync-exclude rules.
#
# Glob patterns (matched via fnmatch.fnmatch against upstream-relative
# posix paths) that the project intentionally does NOT adopt from the
# upstream template. See docs/template/manage.md for details.
#
# This file is hand-managed. It is NOT touched by `manage.py sync`.
# (settings.toml IS rewritten by sync, which is why excludes live here.)

exclude = [
    # ── Project intentionally lacks bootstrap.py ──────────────────────
    # The template uses bootstrap.py for first-time setup of new
    # downstream projects. This project is past that stage.
    "bootstrap.py",

    # ── Template example app code ─────────────────────────────────────
    # Upstream ships an example Click CLI at src/package_name/cli.py
    # plus a core/logging scaffold. This project's CLI is structured
    # differently (src/pynetappfoundry/cli/main.py) and the domain code
    # is unrelated.
    "src/package_name/cli.py",
    "src/package_name/core.py",
    "src/package_name/logging.py",
    # __init__.py is heavily project-customized (re-exports for ONTAP/DII
    # API clients, config, logging, DBs). Upstream's is a 6-line scaffold
    # exporting greet/setup_logging — irrelevant here.
    "src/package_name/__init__.py",

    # ── Project-content files ─────────────────────────────────────────
    # These files exist in the upstream template as scaffolds but are
    # 100% project-owned content here.
    "README.md",
    "CHANGELOG.md",
    # mkdocs.yml: top-of-file project metadata (site_name, site_url, etc.)
    # plus a project-specific nav structure (ONTAP usage pages, project ADRs,
    # ONTAP/cloud reference docs). Upstream nav improvements can be pulled in
    # by hand if needed; they're not worth the constant drift flagging.
    "mkdocs.yml",

    # ── Project user-facing documentation ─────────────────────────────
    # These pages document the project's own modules (ONTAP/DII clients,
    # cache, config, CLI) and reference `pynetappfoundry.*` directly.
    # Upstream's versions are generic Python-library scaffolds —
    # importing them via sync (as the initial Phase B bulk-copy did)
    # breaks mkdocstrings because the example `package_name` module
    # doesn't exist locally.
    "docs/index.md",
    "docs/deployment/development.md",
    "docs/deployment/production.md",
    "docs/examples/api.md",
    "docs/examples/README.md",
    "docs/getting-started/installation.md",
    "docs/reference/api.md",
    "docs/usage/basics.md",
    # docs/decisions/README.md: project owns the "Project-level ADRs
    # (0001+)" table. Upstream ships a generic placeholder
    # ("_(No project-level ADRs yet.)_") that, if synced, clobbers the
    # project's ADR-0001..ADR-NNNN list. Surfaced as a rebase conflict
    # in PR #715 after Phase B sync (#723).
    "docs/decisions/README.md",

    # tests/template/test_properties.py — Hypothesis property tests for
    # upstream's example `package_name.core.greet` (which we exclude). The
    # test would ImportError locally since no `package_name` module exists.
    "tests/template/test_properties.py",

    # tests/template/test_bootstrap.py — imports from `bootstrap` module
    # which is itself excluded (bootstrap.py is absent).
    "tests/template/test_bootstrap.py",

    # ── Template scaffold examples ────────────────────────────────────
    # Upstream's examples/ directory is generic Python-package examples
    # (basic_usage.py, cli_usage.py, an api/ scaffold). Not applicable
    # to a NetApp-domain library.
    "examples/**",

    # ── Top-level template tests ──────────────────────────────────────
    # Upstream's tests/test_*.py at the root cover its example CLI, its
    # logging, its CI workflows, and its bundled hooks. The project's
    # tests live under tests/unit/ and tests/integration/. Note: this
    # glob does NOT match tests/template/test_*.py — those tests cover
    # template framework code (tools/doit/, tools/pyproject_template/)
    # that we DO inherit, so we keep them in sync.
    "tests/test_*.py",

    # ── Template example benchmarks + project benchmark fixtures ──────
    # Upstream ships benchmarks for its example src/package_name/core.py
    # and src/package_name/logging.py (which we exclude above). The
    # project keeps its own domain benchmarks in tests/benchmarks/ and
    # its own conftest.py with QEVolume/QENode fixtures the project's
    # bench files import. Excluding the whole directory keeps upstream
    # from clobbering the project fixtures.
    "tests/benchmarks/test_bench_core.py",
    "tests/benchmarks/test_bench_logging.py",
    "tests/benchmarks/conftest.py",
    "tests/benchmarks/__init__.py",

    # ── CBM gate hooks ────────────────────────────────────────────────
    # Adoption tracked separately in issue #717 (explore + enable CBM).
    # The hook files stay out of the project until that decision lands.
    "tools/hooks/ai/cbm-*",

    # ── context-mode wrapper hooks ────────────────────────────────────
    # Adoption tracked separately in issue #718 (explore + enable
    # context-mode). The wrapper files stay out until that decision lands.
    "tools/hooks/ai/context-mode-*",
]
