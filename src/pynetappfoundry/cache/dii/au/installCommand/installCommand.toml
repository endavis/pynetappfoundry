_removed_fields = [
    "commands",
    "description",
    "download",
    "downloadTitle",
    "footer",
    "heading",
    "name",
]

[endpoint]
path = "/au/installCommand/{platform}"
schema = "InstallCommand"
class_name = "DiiAuInstallcommand"

[fields.additionalInstructionsForManualInstallation]
cache_strategy = "cache"

[fields.requirements]
cache_strategy = "cache"

[fields.installCommand]
cache_strategy = "cache"

[fields.imageZipUrl]
cache_strategy = "cache"

[fields.dsWarDownloadUrl]
cache_strategy = "cache"

[fields.supportedOS]
cache_strategy = "cache"

[fields.proxySettingCommand]
cache_strategy = "cache"

[fields.token]
cache_strategy = "cache"
