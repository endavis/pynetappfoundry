[endpoint]
path = "/protocols/s3/services/{svm.uuid}/buckets/{s3_bucket.uuid}/rules"
schema = "s3_bucket_lifecycle_rule"
class_name = "OntapS3BucketLifecycleRule"

[fields.abort_incomplete_multipart_upload_after_initiation_days]
cache_strategy = "cache"

[fields.bucket_name]
cache_strategy = "cache"

[fields.enabled]
cache_strategy = "cache"

[fields.expiration_expired_object_delete_marker]
cache_strategy = "cache"

[fields.expiration_object_age_days]
cache_strategy = "cache"

[fields.expiration_object_expiry_date]
cache_strategy = "cache"

[fields.name]
cache_strategy = "cache"

[fields.non_current_version_expiration_new_non_current_versions]
cache_strategy = "cache"

[fields.non_current_version_expiration_non_current_days]
cache_strategy = "cache"

[fields.object_filter_prefix]
cache_strategy = "cache"

[fields.object_filter_size_greater_than]
cache_strategy = "cache"

[fields.object_filter_size_less_than]
cache_strategy = "cache"

[fields.object_filter_tags]
cache_strategy = "cache"

[fields.svm_name]
cache_strategy = "cache"

[fields.svm_uuid]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"
