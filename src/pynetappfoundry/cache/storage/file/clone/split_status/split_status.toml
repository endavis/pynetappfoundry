[endpoint]
path = "/storage/file/clone/split-status"
schema = "split_status"
class_name = "OntapSplitStatus"

[fields.pending_splits]
cache_strategy = "cache"

[fields.svm_name]
cache_strategy = "cache"

[fields.svm_uuid]
cache_strategy = "cache"

[fields.unsplit_size]
cache_strategy = "cache"

[fields.volume_name]
cache_strategy = "cache"

[fields.volume_uuid]
cache_strategy = "cache"
