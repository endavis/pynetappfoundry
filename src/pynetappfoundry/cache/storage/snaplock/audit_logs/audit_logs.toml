[endpoint]
path = "/storage/snaplock/audit-logs"
schema = "snaplock_log"
class_name = "OntapSnaplockLog"

[fields.log_archive_archive]
cache_strategy = "cache"

[fields.log_archive_base_name]
cache_strategy = "cache"

[fields.log_files]
cache_strategy = "cache"

[fields.log_volume_max_log_size]
cache_strategy = "cache"

[fields.log_volume_retention_period]
cache_strategy = "cache"

[fields.log_volume_volume_name]
cache_strategy = "cache"

[fields.log_volume_volume_uuid]
cache_strategy = "cache"

[fields.svm_name]
cache_strategy = "cache"

[fields.svm_uuid]
cache_strategy = "cache"
