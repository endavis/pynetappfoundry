[endpoint]
path = "/storage/file/clone/split-status"
schema = "split_status"
class_name = "OntapSplitStatus"

[fields.pending_splits]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.unsplit_size]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
