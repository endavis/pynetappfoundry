[endpoint]
path = "/storage/file/clone/split-loads"
schema = "split_load"
class_name = "OntapSplitLoad"

[fields."load.allowable"]
cache_strategy = "cache"

[fields."load.current"]
cache_strategy = "cache"

[fields."load.maximum"]
cache_strategy = "cache"

[fields."load.token_reserved"]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"
