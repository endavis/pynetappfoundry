[endpoint]
path = "/storage/file/clone/tokens"
schema = "token"
class_name = "OntapToken"

[fields."expiry_time.left"]
cache_strategy = "cache"

[fields."expiry_time.limit"]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields.reserve_size]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"
