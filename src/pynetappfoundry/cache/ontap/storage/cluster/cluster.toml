[endpoint]
path = "/storage/cluster"
schema = "cluster_space"
class_name = "OntapClusterSpace"

[fields."block_storage.available"]
cache_strategy = "realtime"

[fields."block_storage.inactive_data"]
cache_strategy = "cache"

[fields."block_storage.medias"]
cache_strategy = "cache"

[fields."block_storage.physical_used"]
cache_strategy = "realtime"

[fields."block_storage.size"]
cache_strategy = "realtime"

[fields."block_storage.used"]
cache_strategy = "realtime"

[fields."cloud_storage.used"]
cache_strategy = "cache"

[fields."efficiency.logical_used"]
cache_strategy = "realtime"

[fields."efficiency.ratio"]
cache_strategy = "realtime"

[fields."efficiency.savings"]
cache_strategy = "realtime"

[fields."efficiency_without_snapshots.logical_used"]
cache_strategy = "realtime"

[fields."efficiency_without_snapshots.ratio"]
cache_strategy = "realtime"

[fields."efficiency_without_snapshots.savings"]
cache_strategy = "realtime"

[fields."efficiency_without_snapshots_flexclones.logical_used"]
cache_strategy = "realtime"

[fields."efficiency_without_snapshots_flexclones.ratio"]
cache_strategy = "realtime"

[fields."efficiency_without_snapshots_flexclones.savings"]
cache_strategy = "realtime"
