[endpoint]
path = "/storage/flexcache/flexcaches"
schema = "flexcache"
class_name = "OntapFlexcache"

[fields.aggregates]
cache_strategy = "cache"

[fields."atime_scrub.enabled"]
cache_strategy = "cache"

[fields."atime_scrub.period"]
cache_strategy = "cache"

[fields."cifs_change_notify.enabled"]
cache_strategy = "cache"

[fields.constituents_per_aggregate]
cache_strategy = "cache"

[fields.dr_cache]
cache_strategy = "cache"

[fields.global_file_locking_enabled]
cache_strategy = "cache"

[fields."guarantee.type_"]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields.name]
cache_strategy = "cache"

[fields.origins]
cache_strategy = "cache"

[fields.override_encryption]
cache_strategy = "cache"

[fields.path]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields."prepopulate.dir_paths"]
cache_strategy = "cache"

[fields."prepopulate.exclude_dir_paths"]
cache_strategy = "cache"

[fields."prepopulate.recurse"]
cache_strategy = "cache"

[fields."relative_size.enabled"]
cache_strategy = "cache"

[fields."relative_size.percentage"]
cache_strategy = "cache"

[fields.size]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.use_tiered_aggregate]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"

[fields."writeback.enabled"]
cache_strategy = "cache"
