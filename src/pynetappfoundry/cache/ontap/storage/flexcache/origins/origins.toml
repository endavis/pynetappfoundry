[endpoint]
path = "/storage/flexcache/origins/{uuid}"
schema = "flexcache_origin"
class_name = "OntapFlexcacheOrigin"

[fields."cluster.name"]
cache_strategy = "cache"

[fields."cluster.uuid"]
cache_strategy = "cache"

[fields.create_time]
cache_strategy = "cache"

[fields.ip_address]
cache_strategy = "cache"

[fields.size]
cache_strategy = "cache"

[fields.state]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
