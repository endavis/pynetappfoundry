[endpoint]
path = "/storage/flexcache/origins/{uuid}"
schema = "flexcache_origin"
class_name = "OntapFlexcacheOrigin"

[fields.cluster_name]
cache_strategy = "cache"

[fields.cluster_uuid]
cache_strategy = "cache"

[fields.create_time]
cache_strategy = "cache"

[fields.ip_address]
cache_strategy = "cache"

[fields.size]
cache_strategy = "cache"

[fields.state]
cache_strategy = "cache"

[fields.svm_name]
cache_strategy = "cache"

[fields.svm_uuid]
cache_strategy = "cache"

[fields.volume_name]
cache_strategy = "cache"

[fields.volume_uuid]
cache_strategy = "cache"
