[endpoint]
path = "/storage/quota/rules"
schema = "quota_rule"
class_name = "OntapQuotaRule"

[fields."files.hard_limit"]
cache_strategy = "realtime"

[fields."files.soft_limit"]
cache_strategy = "realtime"

[fields."group.id"]
cache_strategy = "cache"

[fields."group.name"]
cache_strategy = "cache"

[fields."qtree.id"]
cache_strategy = "cache"

[fields."qtree.name"]
cache_strategy = "cache"

[fields."space.hard_limit"]
cache_strategy = "realtime"

[fields."space.soft_limit"]
cache_strategy = "realtime"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.type_]
cache_strategy = "cache"

[fields.user_mapping]
cache_strategy = "cache"

[fields.users]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
