[endpoint]
path = "/storage/volumes/{volume.uuid}/top-metrics/files"
schema = "top_metrics_file"
class_name = "OntapTopMetricsFile"

[fields."iops.error.lower_bound"]
cache_strategy = "cache"

[fields."iops.error.upper_bound"]
cache_strategy = "cache"

[fields."iops.read"]
cache_strategy = "cache"

[fields."iops.write"]
cache_strategy = "cache"

[fields.path]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields."throughput.error.lower_bound"]
cache_strategy = "cache"

[fields."throughput.error.upper_bound"]
cache_strategy = "cache"

[fields."throughput.read"]
cache_strategy = "cache"

[fields."throughput.write"]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
