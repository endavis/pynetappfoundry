[endpoint]
path = "/storage/volumes/{volume.uuid}/snapshots"
schema = "snapshot"
class_name = "OntapSnapshot"

[fields.comment]
cache_strategy = "cache"

[fields.compress_savings]
cache_strategy = "realtime"

[fields.create_time]
cache_strategy = "cache"

[fields.dedup_savings]
cache_strategy = "realtime"

[fields."delta.size_consumed"]
cache_strategy = "realtime"

[fields."delta.time_elapsed"]
cache_strategy = "cache"

[fields.expiry_time]
cache_strategy = "cache"

[fields.logical_size]
cache_strategy = "realtime"

[fields.name]
cache_strategy = "cache"

[fields.owners]
cache_strategy = "cache"

[fields."provenance_volume.uuid"]
cache_strategy = "cache"

[fields.reclaimable_space]
cache_strategy = "realtime"
requires_explicit_fetch = true

[fields.size]
cache_strategy = "realtime"

[fields."snaplock.expired"]
cache_strategy = "cache"

[fields."snaplock.expiry_time"]
cache_strategy = "cache"

[fields."snaplock.time_until_expiry"]
cache_strategy = "cache"

[fields.snaplock_expiry_time]
cache_strategy = "cache"

[fields.snapmirror_label]
cache_strategy = "cache"

[fields.state]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"

[fields.vbn0_savings]
cache_strategy = "realtime"

[fields.version_uuid]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
