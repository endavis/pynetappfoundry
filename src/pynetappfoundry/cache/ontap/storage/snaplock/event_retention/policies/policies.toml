[endpoint]
path = "/storage/snaplock/event-retention/policies"
schema = "snaplock_retention_policy"
class_name = "OntapSnaplockRetentionPolicy"

[fields.name]
cache_strategy = "cache"

[fields.retention_period]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"
