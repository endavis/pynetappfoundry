[endpoint]
path = "/storage/snaplock/audit-logs"
schema = "snaplock_log"
class_name = "OntapSnaplockLog"

[fields."log_archive.archive"]
cache_strategy = "cache"

[fields."log_archive.base_name"]
cache_strategy = "cache"

[fields.log_files]
cache_strategy = "cache"

[fields."log_volume.max_log_size"]
cache_strategy = "cache"

[fields."log_volume.retention_period"]
cache_strategy = "cache"

[fields."log_volume.volume.name"]
cache_strategy = "cache"

[fields."log_volume.volume.uuid"]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"
