_removed_fields = [
    "algorithm",
    "data_fingerprint",
    "file_size",
    "file_type",
    "metadata_fingerprint",
    "path",
    "scope",
    "state",
]

[endpoint]
path = "/storage/snaplock/file-fingerprints"
schema = "snaplock_file_fingerprint_get"
class_name = "OntapSnaplockFileFingerprint"

[fields.id]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
