[endpoint]
path = "/storage/snapshot-policies/{snapshot_policy.uuid}/schedules"
schema = "snapshot_policy_schedule"
class_name = "OntapSnapshotPolicySchedule"

[fields.count]
cache_strategy = "cache"

[fields.prefix]
cache_strategy = "cache"

[fields.retention_period]
cache_strategy = "cache"

[fields.schedule_name]
cache_strategy = "cache"

[fields.schedule_uuid]
cache_strategy = "cache"

[fields.snapmirror_label]
cache_strategy = "cache"

[fields.snapshot_policy_name]
cache_strategy = "cache"

[fields.snapshot_policy_uuid]
cache_strategy = "cache"
