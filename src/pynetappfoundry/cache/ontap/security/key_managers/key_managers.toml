[endpoint]
path = "/security/key-managers"
schema = "security_key_manager"
class_name = "OntapSecurityKeyManager"

[fields."configuration.name"]
cache_strategy = "cache"

[fields."configuration.uuid"]
cache_strategy = "cache"

[fields.enabled]
cache_strategy = "cache"

[fields."external.client_certificate.name"]
cache_strategy = "cache"

[fields."external.client_certificate.uuid"]
cache_strategy = "cache"

[fields."external.server_ca_certificates"]
cache_strategy = "cache"

[fields."external.servers"]
cache_strategy = "cache"

[fields.is_default_data_at_rest_encryption_disabled]
cache_strategy = "cache"

[fields."onboard.enabled"]
cache_strategy = "cache"

[fields."onboard.existing_passphrase"]
cache_strategy = "cache"

[fields."onboard.key_backup"]
cache_strategy = "cache"

[fields."onboard.passphrase"]
cache_strategy = "cache"

[fields."onboard.synchronize"]
cache_strategy = "cache"

[fields.policy]
cache_strategy = "cache"

[fields.scope]
cache_strategy = "cache"

[fields."status.code"]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields."status.message"]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"

[fields."volume_encryption.code"]
cache_strategy = "cache"

[fields."volume_encryption.message"]
cache_strategy = "cache"

[fields."volume_encryption.supported"]
cache_strategy = "cache"
