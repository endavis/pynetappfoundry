[endpoint]
path = "/security/login/totps"
schema = "totp"
class_name = "OntapTotp"

[fields."account.name"]
cache_strategy = "cache"

[fields.comment]
cache_strategy = "cache"

[fields.enabled]
cache_strategy = "cache"

[fields."owner.name"]
cache_strategy = "cache"

[fields."owner.uuid"]
cache_strategy = "cache"

[fields.scope]
cache_strategy = "cache"

[fields.sha_fingerprint]
cache_strategy = "cache"
