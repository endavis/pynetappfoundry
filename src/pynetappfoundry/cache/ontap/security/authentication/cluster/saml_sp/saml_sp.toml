[endpoint]
path = "/security/authentication/cluster/saml-sp"
schema = "security_saml_sp"
class_name = "OntapSecuritySamlSp"

[fields."certificate.ca"]
cache_strategy = "cache"

[fields."certificate.common_name"]
cache_strategy = "cache"

[fields."certificate.serial_number"]
cache_strategy = "cache"

[fields.enabled]
cache_strategy = "cache"

[fields.host]
cache_strategy = "cache"

[fields.idp_uri]
cache_strategy = "cache"
