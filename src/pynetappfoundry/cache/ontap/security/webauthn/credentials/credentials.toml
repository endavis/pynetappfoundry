[endpoint]
path = "/security/webauthn/credentials"
schema = "webauthn_credentials"
class_name = "OntapWebauthnCredentials"

[fields.creation_time]
cache_strategy = "cache"

[fields."credential.id_sha"]
cache_strategy = "cache"

[fields."credential.type_"]
cache_strategy = "cache"

[fields.display_name]
cache_strategy = "cache"

[fields.index]
cache_strategy = "cache"

[fields.last_used_time]
cache_strategy = "cache"

[fields."owner.name"]
cache_strategy = "cache"

[fields."owner.uuid"]
cache_strategy = "cache"

[fields."public_key.algorithm"]
cache_strategy = "cache"

[fields."public_key.value"]
cache_strategy = "cache"

[fields."relying_party.id"]
cache_strategy = "cache"

[fields."relying_party.name"]
cache_strategy = "cache"

[fields.scope]
cache_strategy = "cache"

[fields.username]
cache_strategy = "cache"
