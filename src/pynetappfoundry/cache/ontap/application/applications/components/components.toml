[endpoint]
path = "/application/applications/{application.uuid}/components"
schema = "application_component"
class_name = "OntapApplicationComponent"

[fields."application.name"]
cache_strategy = "cache"

[fields."application.uuid"]
cache_strategy = "cache"

[fields."backing_storage.luns"]
cache_strategy = "cache"

[fields."backing_storage.namespaces"]
cache_strategy = "cache"

[fields."backing_storage.volumes"]
cache_strategy = "cache"

[fields.cifs_access]
cache_strategy = "cache"

[fields.file_system]
cache_strategy = "cache"

[fields.host_management_url]
cache_strategy = "cache"

[fields.host_name]
cache_strategy = "cache"

[fields.name]
cache_strategy = "cache"

[fields.nfs_access]
cache_strategy = "cache"

[fields.nvme_access]
cache_strategy = "cache"

[fields.protection_groups]
cache_strategy = "cache"

[fields.san_access]
cache_strategy = "cache"

[fields."storage_service.name"]
cache_strategy = "cache"

[fields."storage_service.uuid"]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"
