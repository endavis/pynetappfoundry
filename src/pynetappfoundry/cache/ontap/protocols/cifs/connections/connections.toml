[endpoint]
path = "/protocols/cifs/connections"
schema = "cifs_connection"
class_name = "OntapCifsConnection"

[fields.client_ip]
cache_strategy = "cache"

[fields.client_port]
cache_strategy = "cache"

[fields.identifier]
cache_strategy = "cache"

[fields.network_context_id]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields.server_ip]
cache_strategy = "cache"

[fields.sessions]
cache_strategy = "realtime"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"
