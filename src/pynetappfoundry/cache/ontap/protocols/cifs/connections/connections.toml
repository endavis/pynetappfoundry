[endpoint]
path = "/protocols/cifs/connections"
schema = "cifs_connection"
class_name = "OntapCifsConnection"

[fields.client_ip]
cache_strategy = "cache"

[fields.client_port]
cache_strategy = "cache"

[fields.identifier]
cache_strategy = "cache"

[fields.network_context_id]
cache_strategy = "cache"

[fields.node_name]
cache_strategy = "cache"

[fields.node_uuid]
cache_strategy = "cache"

[fields.server_ip]
cache_strategy = "cache"

[fields.sessions]
cache_strategy = "realtime"

[fields.svm_name]
cache_strategy = "cache"

[fields.svm_uuid]
cache_strategy = "cache"
