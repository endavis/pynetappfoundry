[endpoint]
path = "/protocols/cifs/session/files"
schema = "cifs_open_file"
class_name = "OntapCifsOpenFile"

[fields."connection.count"]
cache_strategy = "realtime"

[fields."connection.identifier"]
cache_strategy = "cache"

[fields.continuously_available]
cache_strategy = "realtime"

[fields.identifier]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields.open_mode]
cache_strategy = "cache"

[fields.path]
cache_strategy = "cache"

[fields.range_locks_count]
cache_strategy = "realtime"

[fields."session.identifier"]
cache_strategy = "cache"

[fields."share.mode"]
cache_strategy = "cache"

[fields."share.name"]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.type_]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
