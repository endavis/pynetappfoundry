[endpoint]
path = "/protocols/fpolicy/{svm.uuid}/connections"
schema = "fpolicy_connection"
class_name = "OntapFpolicyConnection"

[fields."disconnected_reason.code"]
cache_strategy = "cache"

[fields."disconnected_reason.message"]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields."policy.name"]
cache_strategy = "cache"

[fields.server]
cache_strategy = "cache"

[fields.session_uuid]
cache_strategy = "cache"

[fields.state]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.type_]
cache_strategy = "cache"

[fields.update_time]
cache_strategy = "cache"
