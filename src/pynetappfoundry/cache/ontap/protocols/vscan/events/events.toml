[endpoint]
path = "/protocols/vscan/{svm.uuid}/events"
schema = "vscan_event"
class_name = "OntapVscanEvent"

[fields.disconnect_reason]
cache_strategy = "cache"

[fields.event_time]
cache_strategy = "cache"

[fields.file_path]
cache_strategy = "cache"

[fields."interface.ip.address"]
cache_strategy = "cache"

[fields."interface.name"]
cache_strategy = "cache"

[fields."interface.uuid"]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields.server]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.type_]
cache_strategy = "cache"

[fields.vendor]
cache_strategy = "cache"

[fields.version]
cache_strategy = "cache"
