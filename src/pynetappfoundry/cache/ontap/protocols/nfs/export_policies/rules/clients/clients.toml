[endpoint]
path = "/protocols/nfs/export-policies/{policy.id}/rules/{index}/clients"
schema = "export_client"
class_name = "OntapExportClient"

[fields.index]
cache_strategy = "cache"

[fields.match]
cache_strategy = "cache"

[fields."policy.id"]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"
