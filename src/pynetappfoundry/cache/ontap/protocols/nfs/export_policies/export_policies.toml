_removed_fields = [
    "allow_device_creation",
    "allow_suid",
    "anonymous_user",
    "chown_mode",
    "clients",
    "index",
    "ntfs_unix_security",
    "protocols",
    "ro_rule",
    "rw_rule",
    "superuser",
]

[endpoint]
path = "/protocols/nfs/export-policies"
schema = "export_policy"
class_name = "OntapExportPolicy"

[fields.id]
cache_strategy = "cache"

[fields.name]
cache_strategy = "cache"

[fields.rules]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"
