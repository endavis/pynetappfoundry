[endpoint]
path = "/protocols/nfs/connected-clients"
schema = "nfs_clients"
class_name = "OntapNfsClients"

[fields.client_ip]
cache_strategy = "cache"

[fields."export_policy.id"]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields."export_policy.name"]
cache_strategy = "cache"

[fields.idle_duration]
cache_strategy = "realtime"

[fields.local_request_count]
cache_strategy = "realtime"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields.protocol]
cache_strategy = "cache"

[fields.remote_request_count]
cache_strategy = "realtime"

[fields.server_ip]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.trunking_enabled]
cache_strategy = "cache"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
