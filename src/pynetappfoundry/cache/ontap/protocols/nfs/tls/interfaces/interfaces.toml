[endpoint]
path = "/protocols/nfs/tls/interfaces"
schema = "nfs_tls_interface"
class_name = "OntapNfsTlsInterface"

[fields."certificate.name"]
cache_strategy = "cache"

[fields."certificate.uuid"]
cache_strategy = "cache"

[fields.enabled]
cache_strategy = "cache"

[fields."interface.ip.address"]
cache_strategy = "cache"

[fields."interface.name"]
cache_strategy = "cache"

[fields."interface.uuid"]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"
