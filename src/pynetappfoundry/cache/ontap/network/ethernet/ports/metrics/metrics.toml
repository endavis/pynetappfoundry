[endpoint]
path = "/network/ethernet/ports/{uuid}/metrics"
schema = "port_metrics_response"
class_name = "OntapPortMetricsResponse"

[fields.duration]
cache_strategy = "cache"

[fields.status]
cache_strategy = "cache"

[fields."throughput.read"]
cache_strategy = "cache"

[fields."throughput.total"]
cache_strategy = "cache"

[fields."throughput.write"]
cache_strategy = "cache"

[fields.timestamp]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"
