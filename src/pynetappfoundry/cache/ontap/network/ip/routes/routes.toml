[endpoint]
path = "/network/ip/routes"
schema = "network_route"
class_name = "OntapNetworkRoute"

[fields."destination.address"]
cache_strategy = "cache"

[fields."destination.family"]
cache_strategy = "cache"

[fields."destination.netmask"]
cache_strategy = "cache"

[fields.gateway]
cache_strategy = "cache"

[fields.interfaces]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields."ipspace.name"]
cache_strategy = "cache"

[fields."ipspace.uuid"]
cache_strategy = "cache"

[fields.metric]
cache_strategy = "cache"

[fields.scope]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"
