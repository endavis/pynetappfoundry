[endpoint]
path = "/network/fc/fabrics/{fabric.name}/zones"
schema = "fc_zone"
class_name = "OntapFcZone"

[fields."cache.age"]
cache_strategy = "cache"

[fields."cache.is_current"]
cache_strategy = "cache"

[fields."cache.update_time"]
cache_strategy = "cache"

[fields."fabric.name"]
cache_strategy = "cache"

[fields.members]
cache_strategy = "cache"
requires_explicit_fetch = true

[fields.name]
cache_strategy = "cache"
