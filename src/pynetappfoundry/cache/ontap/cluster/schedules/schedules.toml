[endpoint]
path = "/cluster/schedules"
schema = "schedule"
class_name = "OntapSchedule"

[fields."cluster.name"]
cache_strategy = "cache"

[fields."cluster.uuid"]
cache_strategy = "cache"

[fields."cron.days"]
cache_strategy = "cache"

[fields."cron.hours"]
cache_strategy = "cache"

[fields."cron.minutes"]
cache_strategy = "cache"

[fields."cron.months"]
cache_strategy = "cache"

[fields."cron.weekdays"]
cache_strategy = "cache"

[fields.interval]
cache_strategy = "cache"

[fields.name]
cache_strategy = "cache"

[fields.scope]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.type_]
cache_strategy = "cache"

[fields.uuid]
cache_strategy = "cache"
