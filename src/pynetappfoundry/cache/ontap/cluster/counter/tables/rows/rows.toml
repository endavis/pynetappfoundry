[endpoint]
path = "/cluster/counter/tables/{counter_table.name}/rows"
schema = "counter_row"
class_name = "OntapCounterRow"

[fields."aggregation.complete"]
cache_strategy = "cache"

[fields."aggregation.count"]
cache_strategy = "cache"

[fields."counter_table.name"]
cache_strategy = "cache"

[fields.counters]
cache_strategy = "cache"

[fields.id]
cache_strategy = "cache"

[fields.properties]
cache_strategy = "cache"
