[endpoint]
path = "/svm/migrations/{svm_migration.uuid}/volumes"
schema = "svm_migration_volume"
class_name = "OntapSvmMigrationVolume"

[fields.errors]
cache_strategy = "cache"

[fields.healthy]
cache_strategy = "cache"

[fields."node.name"]
cache_strategy = "cache"

[fields."node.uuid"]
cache_strategy = "cache"

[fields."svm.name"]
cache_strategy = "cache"

[fields."svm.uuid"]
cache_strategy = "cache"

[fields.transfer_state]
cache_strategy = "realtime"

[fields."volume.name"]
cache_strategy = "cache"

[fields."volume.uuid"]
cache_strategy = "cache"
