# Hand-written spec fragment for the Console ``/agents-mgmt`` operations (#1078).
#
# These endpoints are not in the NetAppDocs console-automation sources, so the
# builder cannot parse them. The fields below come from live lab probes 2 and 3
# of #1078 (list-connectors for an organization, and get-agent for one agent);
# every operation is tagged ``x-evidence: live``. Every scalar is nullable and
# no schema has a ``required`` list, because the live responses carry nulls and
# omit keys. On real agents ``clientInfraStatus`` is an object; its inner keys
# are not measured, so it is modelled as an open map (#1091). Each operation keeps its own Agent schema so each generated model
# module is self-contained.
#
# Merged into the committed spec by tools/console_openapi/fragments.py, by both
# ``cli build`` and the offline ``doit console_openapi_fragments``. The
# operations do not set ``x-token-type``, so either token works.
x-namespace: agentsmgmt
paths:
  /agents-mgmt/list-connectors/{organization_id}:
    get:
      operationId: agentsmgmt_get_list_connectors_by_organization_id
      summary: List the agents (connectors) of an organization
      description: Lists the Console agents registered in the specified organization.
      tags:
        - agentsmgmt
      x-source-file: agentsmgmt/get-list-connectors.yaml
      x-evidence: live
      parameters:
        - name: organization_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the organization whose agents are listed.
      responses:
        "200":
          description: The agents of the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsmgmt.get-list-connectors.ResponseBody"
      security:
        - BearerAuth: []
      servers:
        - url: https://api.bluexp.netapp.com
          description: BlueXP / NetApp Console SaaS API (host root)
  /agents-mgmt/agent/{agent_id}:
    get:
      operationId: agentsmgmt_get_agent_by_agent_id
      summary: Retrieve one agent
      description: Returns the Console agent with the specified id.
      tags:
        - agentsmgmt
      x-source-file: agentsmgmt/get-agent.yaml
      x-evidence: live
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the agent.
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentsmgmt.get-agent.ResponseBody"
      security:
        - BearerAuth: []
      servers:
        - url: https://api.bluexp.netapp.com
          description: BlueXP / NetApp Console SaaS API (host root)
