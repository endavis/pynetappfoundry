# GET operations whose success response is a JSON array (#1021, #1034, #1033).
# The [dw] entry is the one non-cvo table: the preferred-subscriptions GET is
# documented as an object but returned an array live (empty for the probed account).
#
# The Console agent docs type every response body as one object and carry no
# list marker, so the builder cannot tell a list from an object. The builder
# wraps the hoisted ``ResponseBody`` of each operation listed here as
# ``{type: array, items: {$ref: ...ResponseBody}}`` and reads nothing else.
#
# Each key is ``"<METHOD> <full spec path>"``, using the spec's own parameter
# names. Each value is the evidence for the entry:
#   "live"    -- confirmed against a live Console agent.
#   "swagger" -- the agent swagger (docs/example-config/apis/occm/openapi3.json,
#                v3.2.0) types the 200 response of this GET as an array. Not
#                confirmed live; the trailing comment on the line gives the
#                reason (#1033).
#
# Reason codes for the "swagger" entries (the lab agent could not be probed):
#   no-cvo-we        -- needs a Cloud Volumes ONTAP working environment.
#   no-cloud-account -- needs a cloud provider account, subscription, project
#                       or region.
#   no-fsx           -- needs an FSx for ONTAP file system.
#   needs-two-we     -- needs two working environments (source and target).
#   no-param-source  -- a path parameter has no documented source.
#
# tests/unit/console_openapi/test_array_responses.py checks this list against
# the committed spec and the swagger, and that every "swagger" entry carries a
# reason code. Three swagger arrays are left out because
# the docs give the operation no response body to wrap:
#   cvo_get_occm_api_aws_ha_metadata_key_pairs
#   cvo_get_occm_api_vsa_metadata_key_pairs
#   cvo_get_occm_api_replication_metadata_snapshot_labels_by_workingEnvironmentId_by_svmName_by_volumeName

